<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Организационная структура · КазМунайТениз</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --glass:rgba(255,255,255,.75); --glass2:#ffffff;
  --stroke:rgba(15,40,80,.10); --text:#0f1b33; --muted:#5d6b88; --dim:#9aa6bf;
  --line:rgba(22,140,210,.45); --cyan:#1596d4; --violet:#7c5cf0; --gold:#e0a200;
  --green:#12a679; --orange:#ea7a1c; --pink:#d9468f; --blue:#2f7fe0; --red:#e14b4b;
  --brand:#1aa3e0; --navy:#0b2545;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Manrope,Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(900px 600px at 10% -10%,rgba(26,163,224,.14),transparent 60%),
             radial-gradient(800px 600px at 100% 0%,rgba(11,37,69,.06),transparent 60%),
             radial-gradient(900px 700px at 50% 120%,rgba(26,163,224,.08),transparent 60%);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(11,37,69,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(11,37,69,.05) 1px,transparent 1px);
  background-size:40px 40px;mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 80%)}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding:14px 18px 10px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,rgba(243,246,251,.96),rgba(243,246,251,.75) 80%,transparent);backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.logo{height:42px;flex:none;display:block}
.logo img{height:100%;display:block}
.brand .sep{width:1px;height:34px;background:var(--stroke);flex:none}
.logo-kmg{height:30px;opacity:.95}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:12px;color:var(--muted)}
.search{position:relative}
.search input{width:240px;background:var(--glass);border:1px solid var(--stroke);color:var(--text);border-radius:12px;padding:9px 12px 9px 34px;font:inherit;font-size:13px;outline:none;transition:.2s}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(26,163,224,.18);width:280px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;opacity:.6}
.btn,.search input,.stat{box-shadow:0 1px 2px rgba(11,37,69,.06)}
.btn{background:var(--glass);border:1px solid var(--stroke);color:var(--text);border-radius:11px;padding:8px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.18s;white-space:nowrap}
.btn:hover{background:var(--glass2);border-color:rgba(26,163,224,.45);transform:translateY(-1px)}
.btn.on{background:linear-gradient(135deg,rgba(26,163,224,.18),rgba(26,163,224,.08));border-color:var(--brand);color:var(--navy)}
.btn.icon{padding:8px 10px;min-width:36px;justify-content:center}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--glass);border:1px solid var(--stroke);border-radius:14px;padding:8px 14px;min-width:112px;position:relative;overflow:hidden;cursor:pointer;transition:.18s}
.stat:hover{border-color:rgba(26,163,224,.4)}
.stat.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset,0 0 22px -6px var(--c)}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.3px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.stat .bar{height:4px;border-radius:4px;background:rgba(11,37,69,.08);margin-top:6px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:4px;transition:width .5s}

/* ---------- canvas ---------- */
#viewport{position:fixed;inset:0;cursor:grab;touch-action:none}
#viewport.grabbing{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;padding:60px 80px 120px}
.zoombox{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;flex-direction:column;gap:6px}
.zoombox .lvl{font-size:11px;text-align:center;color:var(--muted);font-weight:700}
.legend{position:fixed;left:18px;bottom:18px;z-index:20;display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);
  background:rgba(255,255,255,.85);border:1px solid var(--stroke);padding:8px 12px;border-radius:12px;backdrop-filter:blur(8px)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ---------- tree connectors ---------- */
.tree,.tree ul{display:flex;justify-content:center}
.tree ul{padding-top:30px;position:relative}
.tree li{list-style:none;position:relative;padding:30px 14px 0;display:flex;flex-direction:column;align-items:center}
.tree>li{padding-top:0}
.tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;width:50%;height:30px;border-top:2px solid var(--line)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 12px 0 0}
.tree li:first-child::after{border-radius:12px 0 0 0}
.tree ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--line);height:30px}
.tree>li::before,.tree>li::after{display:none}
.collapsed>ul{display:none}

/* ---------- cards ---------- */
.card{position:relative;background:#fff;border:1px solid var(--stroke);
  border-radius:18px;box-shadow:0 1px 2px rgba(11,37,69,.05),0 10px 28px -14px rgba(11,37,69,.22);transition:transform .18s,box-shadow .18s,border-color .18s,opacity .25s}
.card:hover{border-color:color-mix(in srgb,var(--acc) 70%,transparent);box-shadow:0 14px 40px -12px color-mix(in srgb,var(--acc) 55%,transparent)}
.card.unit-top{padding:14px 26px;min-width:320px;text-align:center;cursor:pointer}
.card.unit-top::before,.card.pos::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--acc),transparent 45%,transparent 60%,color-mix(in srgb,var(--acc) 60%,transparent));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.unit-top .kicker{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc);font-weight:800}
.unit-top .ttl{font-size:17px;font-weight:800;margin-top:2px}

.card.pos{width:290px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left}
.card.pos.big{width:340px;padding:16px}
.pos .meta{min-width:0;flex:1}
.pos .nm{font-size:14px;font-weight:700;line-height:1.2}
.pos .nm.vac{color:var(--dim);font-style:italic;font-weight:600}
.pos .rl{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
.tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border-radius:6px;border:1px solid}
.tag.staff{color:#0b78b0;border-color:rgba(21,150,212,.35);background:rgba(21,150,212,.08)}
.tag.out{color:#c45f0c;border-color:rgba(234,122,28,.4);background:rgba(234,122,28,.08)}
.tag.aup{color:#5b3fd0;border-color:rgba(124,92,240,.35);background:rgba(124,92,240,.08)}
.tag.pp{color:#0b8a63;border-color:rgba(18,166,121,.35);background:rgba(18,166,121,.08)}
.tag.fte{color:#9a6c00;border-color:rgba(224,162,0,.4);background:rgba(224,162,0,.1)}

.toggle{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;
  background:#fff;border:1px solid var(--line);color:var(--cyan);box-shadow:0 2px 6px rgba(11,37,69,.15);font-size:13px;font-weight:800;display:grid;place-items:center;cursor:pointer;z-index:3;line-height:1}
.toggle:hover{background:var(--cyan);color:#fff}

/* avatar */
.ava{flex:none;width:52px;height:52px;border-radius:50%;position:relative;padding:2px;
  background:conic-gradient(from 210deg,var(--acc),transparent 40%,var(--acc) 70%,transparent);}
.big .ava{width:62px;height:62px}
.ava>div{width:100%;height:100%;border-radius:50%;background:linear-gradient(160deg,#eef4fb,#dfe9f5);display:grid;place-items:center;overflow:hidden;border:2px solid #fff}
.ava img{width:100%;height:100%;object-fit:cover}
.ava svg{width:62%;height:62%;opacity:.9}
.ava .ini{font-weight:800;font-size:16px;color:var(--acc)}
.ava .dot{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:#c3ccdb}
.ava .dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}

/* assistants (side) */
.with-assist{position:relative}
.assist{position:absolute;left:calc(100% + 60px);bottom:0;display:flex;flex-direction:column;gap:10px}
.assist::before{content:'';position:absolute;right:100%;bottom:38px;width:60px;border-top:2px dashed var(--line)}
.assist .card.pos{width:270px;padding:10px 12px}
.assist .ava{width:42px;height:42px}
.assist-label{position:absolute;left:4px;bottom:calc(100% + 6px);white-space:nowrap;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:800}

/* department */
.dept{width:310px;border-radius:20px;overflow:visible}
.dept .head{padding:14px 16px 12px;cursor:pointer;border-radius:20px 20px 0 0;position:relative;
  background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 30%,transparent),color-mix(in srgb,var(--acc) 6%,transparent))}
.dept .head{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 16%,#fff),color-mix(in srgb,var(--acc) 4%,#fff))!important}
.dept .head::after{content:'';position:absolute;left:16px;right:16px;bottom:0;height:1px;background:linear-gradient(90deg,var(--acc),transparent)}
.dept .k{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--acc);font-weight:800;display:flex;justify-content:space-between;align-items:center}
.dept .k .cnt{background:var(--acc);color:#fff;border-radius:20px;padding:2px 9px;font-size:12px;letter-spacing:0}
.dept .t{font-size:15px;font-weight:800;margin-top:5px;line-height:1.25}
.dept .sub{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:8px;font-weight:600}
.dept .prog{height:5px;border-radius:5px;background:rgba(11,37,69,.08);margin-top:8px;overflow:hidden}
.dept .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--green));border-radius:5px;transition:width .5s}
.dept .list{padding:10px 10px 14px;display:flex;flex-direction:column;gap:6px;position:relative}
.dept.closed .list{display:none}
.dept.closed .head{border-radius:20px}
.prow{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.15s;position:relative}
.prow:hover{background:#f4f8fd;border-color:rgba(26,163,224,.25)}
.prow .ava{width:38px;height:38px}
.prow .ava .ini{font-size:12px}
.prow .ava .dot{width:10px;height:10px}
.prow .nm{font-size:12.5px;font-weight:700;line-height:1.2}
.prow .nm.vac{color:var(--dim);font-style:italic;font-weight:600}
.prow .rl{font-size:11.5px;color:#33415e;line-height:1.3;margin-top:2px}
.prow .en{font-size:10.5px;color:var(--dim);margin-top:1px}
.prow .num{position:absolute;right:8px;top:8px;font-size:10px;color:var(--dim);font-weight:800}
.prow.lead{background:color-mix(in srgb,var(--acc) 10%,transparent);border-color:color-mix(in srgb,var(--acc) 35%,transparent);margin-bottom:4px}
.prow.lead .rl{color:var(--text);font-weight:700}
.prow .tags{margin-top:4px}
.addrow{margin-top:4px;border:1px dashed rgba(11,37,69,.2);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;display:none}
.addrow:hover{border-color:var(--acc);color:var(--acc)}
body.editing .addrow{display:block}

/* filter & search states */
.dim{opacity:.25;filter:grayscale(.8)}
.hit{outline:2px solid var(--gold);outline-offset:2px;box-shadow:0 0 24px -4px var(--gold)!important;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{outline-color:rgba(224,162,0,.35)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{animation:rise .5s both}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(11,37,69,.35);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid var(--stroke);border-radius:22px;box-shadow:0 30px 80px rgba(11,37,69,.3);animation:rise .25s both}
.mhead{display:flex;gap:16px;align-items:center;padding:20px 20px 16px;border-bottom:1px solid var(--stroke);position:relative}
.mhead .ava{width:84px;height:84px}
.mhead .ava .ini{font-size:26px}
.mhead h3{font-size:18px;font-weight:800;line-height:1.2}
.mhead p{font-size:12.5px;color:var(--muted);margin-top:4px}
.mclose{position:absolute;right:14px;top:14px}
.photo-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mbody{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.fld input,.fld select,.fld textarea{background:#f5f8fc;border:1px solid var(--stroke);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;outline:none}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--cyan)}
.fld select option{background:#fff}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{opacity:.85;border-color:transparent;background:#f7f9fc;color:var(--text)}
.mfoot{display:flex;gap:8px;padding:14px 20px 20px;justify-content:flex-end;flex-wrap:wrap}
.btn.primary{background:linear-gradient(135deg,var(--brand),#0b6fb0);color:#fff;border:0}
.btn.danger{color:var(--red);border-color:rgba(248,113,113,.35)}
.viewonly .edit-only{display:none!important}
.hint{grid-column:1/-1;font-size:12px;color:var(--muted);background:rgba(26,163,224,.06);border:1px solid rgba(26,163,224,.2);padding:9px 11px;border-radius:10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:60;background:var(--navy);color:#fff;border:1px solid var(--stroke);padding:10px 16px;border-radius:12px;font-size:13px;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* export / poster mode */
body.export{overflow:visible;background:var(--bg)}
body.export .topbar,body.export .zoombox,body.export .legend,body.export .toggle{display:none!important}
body.export #viewport{position:static}
body.export #stage{position:static;transform:none!important}
body.export .card{animation:none}
body.export #psub{display:none}
.poster-head{display:none;text-align:center;margin-bottom:40px}
body.export .poster-head{display:block}
.poster-logos{display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:22px}
.poster-logos img{height:70px}.poster-logos .pk{height:52px}.poster-logos .sep{width:1px;height:56px;background:var(--stroke)}
.poster-head h1{font-size:40px;color:var(--navy);font-weight:800;letter-spacing:-.5px}
.poster-head p{color:var(--muted);font-size:16px;margin-top:6px}
.poster-head .stats{justify-content:center;margin-top:22px}
.poster-head .stat{min-width:150px;padding:12px 18px;cursor:default}
.poster-head .stat b{font-size:28px}

@media (max-width:760px){
  .search input{width:150px}.search input:focus{width:180px}
  .stat{min-width:90px;padding:6px 10px}.stat b{font-size:16px}
  .legend{display:none}
  .btn .lbl{display:none}
}
@media print{
  body{overflow:visible} .topbar,.zoombox,.legend,.toggle{display:none!important}
  #viewport{position:static} #stage{position:static;transform:none!important}
  .poster-head{display:block}
}
</style>
</head>

<script>
/* =====================================================================

   fte (ставка), name (ФИО), photo, email, phone, note.
   Числа в шапке считаются автоматически из этих данных.
   ===================================================================== */
const STORE_KEY = 'orgchart_v1';
let _id = 0; const nid = () => 'n' + (++_id);
const P = (title, en = '', emp = 'staff', cat = 'AUP', fte = 1, extra = {}) =>
  ({ id: nid(), kind: 'pos', title, en, emp, cat: emp === 'out' ? '' : cat, fte, name: '', photo: '', email: '', phone: '', note: '', ...extra });
const U = (title, acc, children, extra = {}) => ({ id: nid(), kind: 'unit', title, acc, children, ...extra });

function defaultData() {

  const lead = (t, cat) => P(t, '', 'staff', cat, 1, { lead: true });
  const ppList = arr => arr.map(([t, en]) => P(t, en, 'staff', 'PP'));
  return {
    meta: { title: 'Организационная структура «КазМунайТениз»', subtitle: 'Интерактивная схема · нажмите на карточку' },
    root: U('Наблюдательный совет', '#7c5cf0', [

          P('Комплаенс-офицер', 'Compliance Officer', 'staff', 'AUP', 0.5),
          P('Старший специалист по управлению рисками', 'Risk Management Specialist', 'out')
        ],
        children: [
          P('Заместитель генерального директора по корпоративному управлению', 'Deputy CEO, Corporate Affairs', 'staff', 'AUP', 1, {
            big: true, acc: '#2f7fe0',
            children: [
              U('Отдел по сопровождению бизнеса', '#5b6cf0', [
                lead('Начальник отдела', 'AUP'),
                P('Ведущий юрист', 'Lead Legal Counsel', 'staff', 'AUP'),
                P('Старший специалист по закупкам', 'Senior Procurement Specialist', 'out'),
                P('Специалист по административным вопросам (АХО, канцелярия)', 'Administrative Specialist', 'out'),
                P('Ведущий специалист по оплате труда', 'Lead Payroll Specialist', 'staff', 'AUP'),
                P('Старший специалист по управлению персоналом', 'Senior HR Specialist', 'out')
              ], { list: true }),
              U('Бухгалтерия и казначейство', '#d9468f', [
                lead('Главный бухгалтер', 'AUP'),
                P('Ведущий бухгалтер', 'Lead Accountant', 'staff', 'AUP'),
                P('Старший бухгалтер', 'Senior Accountant', 'out'),
                P('Бухгалтер', 'Accountant', 'out')
              ], { list: true }),
              U('Отдел бизнес-планирования и экономического анализа', '#9b5de5', [

                P('Ведущий экономист', 'Lead Economist', 'staff', 'AUP'),
                P('Старший экономист', 'Senior Economist', 'out')
              ], { list: true })
            ]
          }),
          P('Заместитель генерального директора по проектам', 'Deputy CEO, Projects', 'staff', 'AUP', 1, {
            big: true, acc: '#1aa3e0',
            children: [
              U('Управление по сопровождению Тенгизского проекта', '#ea7a1c', [
                lead('Начальник управления', 'PP'),
                ...ppList([
                  ['Эксперт по гидродинамическому моделированию и симуляциям', 'Reservoir Simulation'],

                  ['Эксперт-технолог', 'Process Engineering'],

                ])
              ], { list: true }),
              U('Управление по сопровождению проекта Каламкас-Море / Хазар', '#0fa39a', [

/* ---------------- state ---------------- */
let DATA, editing = false, filter = null, query = '';
const collapsed = new Set();
const isExport = new URLSearchParams(location.search).has('export');

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); } catch (e) { toast('⚠️ Не хватает места в браузере — уменьшите фото'); } }
function reId(node) { // keep id counter ahead of loaded ids
  const n = parseInt(String(node.id).slice(1)) || 0; if (n > _id) _id = n;
  (node.children || []).forEach(reId); (node.assist || []).forEach(reId);
}
async function load() {
  let saved = null;
  if (!isExport) { try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {} }
  if (!saved && location.protocol.startsWith('http')) {
    try { const r = await fetch('data.json', { cache: 'no-store' }); if (r.ok) saved = await r.json(); } catch (e) {}
  }
  DATA = saved && saved.root ? saved : defaultData();
  if (DATA.meta.title === 'Организационная структура') DATA.meta.title = defaultData().meta.title;
  reId(DATA.root);
}

/* ---------------- helpers ---------------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (Math.round(n * 10) / 10).toString().replace('.', ',');
function walk(node, fn, parent = null) {
  fn(node, parent);
  (node.assist || []).forEach(c => walk(c, fn, node));
  (node.children || []).forEach(c => walk(c, fn, node));
}
function findById(id) { let f = null, p = null; walk(DATA.root, (n, par) => { if (n.id === id) { f = n; p = par; } }); return [f, p]; }
function positionsOf(node) { const a = []; walk(node, n => { if (n.kind === 'pos') a.push(n); }); return a; }
function sum(list, pred = () => true) { return list.filter(pred).reduce((s, n) => s + (+n.fte || 0), 0); }
function initials(name) { return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }
const SIL = '<svg viewBox="0 0 40 40" fill="#9db3cf"><circle cx="20" cy="14" r="7.5"/><path d="M5 38c1.5-9 8-13.5 15-13.5S33.5 29 35 38z"/></svg>';
function avatar(p) {
  const inner = p.photo ? `<img src="${p.photo}" alt="">` : p.name ? `<span class="ini">${esc(initials(p.name))}</span>` : SIL;
  return `<div class="ava"><div>${inner}</div><span class="dot ${p.name ? 'ok' : ''}"></span></div>`;
}
function tags(p) {
  let t = p.emp === 'out' ? '<span class="tag out">Аутстафф</span>' : '<span class="tag staff">Штат</span>';
  if (p.emp !== 'out' && p.cat) t += `<span class="tag ${p.cat === 'AUP' ? 'aup' : 'pp'}">${p.cat === 'AUP' ? 'АУП' : 'ПП'}</span>`;
  if (+p.fte !== 1) t += `<span class="tag fte">${fmt(p.fte)} ст.</span>`;
  return `<div class="tags">${t}</div>`;
}
function matchFilter(p) {
  switch (filter) {
    case 'staff': return p.emp !== 'out';
    case 'out': return p.emp === 'out';
    case 'AUP': return p.emp !== 'out' && p.cat === 'AUP';
    case 'PP': return p.emp !== 'out' && p.cat === 'PP';
    case 'vac': return !p.name;
    case 'fill': return !!p.name;
    default: return true;
  }
}
function matchQuery(p) {
  if (!query) return false;
  return [p.name, p.title, p.en, p.email, p.note].join(' ').toLowerCase().includes(query);
}
function stateCls(p) {
  let c = '';
  if (filter && !matchFilter(p)) c += ' dim';
  if (query) c += matchQuery(p) ? ' hit' : ' dim';
  return c;
}

/* ---------------- render ---------------- */
function renderPosCard(p) {
  const acc = p.acc || '#1aa3e0';
  return `<div class="card pos ${p.big ? 'big' : ''}${stateCls(p)}" style="--acc:${acc}" data-id="${p.id}">
    ${avatar(p)}
    <div class="meta">
      <div class="nm ${p.name ? '' : 'vac'}">${p.name ? esc(p.name) : 'ФИО не указано'}</div>
      <div class="rl">${esc(p.title)}</div>
      ${tags(p)}
    </div>
    ${p.children && p.children.length && !isExport ? `<div class="toggle" data-toggle="${p.id}">${collapsed.has(p.id) ? '+' : '−'}</div>` : ''}
  </div>`;
}
function renderDept(u) {
  const ps = u.children.filter(c => c.kind === 'pos');
  const total = sum(ps), filled = sum(ps, p => p.name), staff = sum(ps, p => p.emp !== 'out'), out = sum(ps, p => p.emp === 'out');
  const closed = collapsed.has(u.id) && !query;
  let i = 0;
  const rows = ps.map(p => {
    const num = p.lead ? '' : ++i;
    return `<div class="prow ${p.lead ? 'lead' : ''}${stateCls(p)}" data-id="${p.id}">
      ${avatar(p)}
      <div class="meta" style="min-width:0;flex:1;padding-right:14px">
        <div class="nm ${p.name ? '' : 'vac'}">${p.name ? esc(p.name) : 'ФИО не указано'}</div>
        <div class="rl">${esc(p.title)}</div>
        ${p.en ? `<div class="en">${esc(p.en)}</div>` : ''}
        ${tags(p)}
      </div>
      ${num ? `<span class="num">${num}</span>` : ''}
    </div>`;
  }).join('');
  return `<div class="card dept ${closed ? 'closed' : ''}" style="--acc:${u.acc}" data-unit="${u.id}">
    <div class="head" data-head="${u.id}">
      <div class="k"><span>${closed ? '▸' : '▾'} Подразделение</span><span class="cnt">${fmt(total)}</span></div>
      <div class="t">${esc(u.title)}</div>
      <div class="sub"><span style="color:var(--cyan)">● Штат ${fmt(staff)}</span>${out ? `<span style="color:var(--orange)">● Аутстафф ${fmt(out)}</span>` : ''}<span style="margin-left:auto">${fmt(filled)}/${fmt(total)} заполнено</span></div>
      <div class="prog"><i style="width:${total ? filled / total * 100 : 0}%"></i></div>
    </div>
    <div class="list">${rows}<div class="addrow" data-add="${u.id}">＋ Добавить должность</div></div>
  </div>`;
}
function renderNode(n) {
  let card;
  if (n.kind === 'unit' && n.list) card = renderDept(n);
  else if (n.kind === 'unit') card = `<div class="card unit-top" style="--acc:${n.acc}" data-unitedit="${n.id}"><div class="kicker">Орган управления</div><div class="ttl">${esc(n.title)}</div></div>`;
  else card = renderPosCard(n);
  if (n.assist && n.assist.length) {
    card = `<div class="with-assist">${card}<div class="assist"><div class="assist-label">Подчинены напрямую</div>${n.assist.map(a => renderPosCard({ ...a, acc: a.emp === 'out' ? '#ea7a1c' : '#d9468f' })).join('')}</div></div>`;
  }
  const kids = (!n.list && n.children && n.children.length) ? `<ul>${n.children.map(renderNode).join('')}</ul>` : '';
  return `<li class="${collapsed.has(n.id) && !query ? 'collapsed' : ''}">${card}${kids}</li>`;
}
function renderStats() {
  const all = positionsOf(DATA.root);
  const staff = sum(all, p => p.emp !== 'out'), aup = sum(all, p => p.emp !== 'out' && p.cat === 'AUP'),
    pp = sum(all, p => p.emp !== 'out' && p.cat === 'PP'), out = sum(all, p => p.emp === 'out'),
    total = sum(all), filled = sum(all, p => p.name);
  const items = [
    ['staff', 'Итого штат', fmt(staff), '#1596d4'],
    ['AUP', 'АУП', fmt(aup), '#7c5cf0'],
    ['PP', 'ПП', fmt(pp), '#12a679'],
    ['out', 'Аутстаффинг', fmt(out), '#ea7a1c'],
    ['fill', 'Заполнено', `${fmt(filled)} / ${fmt(total)}`, '#12a679', total ? filled / total * 100 : 0],
    ['vac', 'Вакансии', fmt(total - filled), '#e14b4b']
  ];
  const html = items.map(([k, l, v, c, pct]) => `<div class="stat ${filter === k ? 'active' : ''}" style="--c:${c}" data-filter="${k}"><span>${l}</span><b>${v}</b>${pct !== undefined ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}</div>`).join('');
  document.getElementById('stats').innerHTML = html;
  document.getElementById('pstats').innerHTML = html;
}
function render() {
  document.getElementById('title').textContent = DATA.meta.title;
  document.getElementById('subtitle').textContent = DATA.meta.subtitle;
  document.getElementById('ptitle').textContent = DATA.meta.title;
  document.getElementById('psub').textContent = DATA.meta.subtitle;
  document.title = DATA.meta.title;
  document.getElementById('tree').innerHTML = renderNode(DATA.root);
  renderStats();
}

/* ---------------- modal ---------------- */
const ov = document.getElementById('ov'), modal = document.getElementById('modal');
let current = null, pendingPhoto = undefined;
function openPos(id) {
  const [p, parent] = findById(id); if (!p) return;
  current = p; pendingPhoto = undefined;
  const dis = editing ? '' : 'disabled';
  const canDelete = parent && parent.list;
  modal.className = 'modal' + (editing ? '' : ' viewonly');
  modal.innerHTML = `
    <div class="mhead" style="--acc:${p.acc || parent?.acc || '#1aa3e0'}">
      <div id="mava">${avatar(p)}</div>
      <div style="min-width:0;flex:1">
        <h3>${p.name ? esc(p.name) : 'ФИО не указано'}</h3>
        <p>${esc(p.title)}${p.en ? ' · ' + esc(p.en) : ''}</p>
        ${parent && parent.kind === 'unit' ? `<p style="color:var(--acc)">${esc(parent.title)}</p>` : ''}
        <div class="photo-actions edit-only">
          <button class="btn" id="mPhoto">📷 Загрузить фото</button>
          <button class="btn" id="mPhotoDel">Убрать фото</button>
        </div>
      </div>
      <button class="btn icon mclose" id="mClose">✕</button>
    </div>
    <div class="mbody">
      ${editing ? '' : '<div class="hint">Чтобы заполнить данные — включите «✏️ Редактировать» вверху.</div>'}
      <div class="fld full"><label>ФИО</label><input id="fName" value="${esc(p.name)}" placeholder="Фамилия Имя Отчество" ${dis}></div>
      <div class="fld full"><label>Должность</label><input id="fTitle" value="${esc(p.title)}" ${dis}></div>
      <div class="fld full"><label>Должность (EN)</label><input id="fEn" value="${esc(p.en)}" ${dis}></div>
      <div class="fld"><label>Тип</label><select id="fEmp" ${dis}><option value="staff" ${p.emp !== 'out' ? 'selected' : ''}>Штат</option><option value="out" ${p.emp === 'out' ? 'selected' : ''}>Аутстаффинг</option></select></div>
      <div class="fld"><label>Категория</label><select id="fCat" ${dis}><option value="AUP" ${p.cat === 'AUP' ? 'selected' : ''}>АУП</option><option value="PP" ${p.cat === 'PP' ? 'selected' : ''}>ПП</option></select></div>
      <div class="fld"><label>Ставка</label><input id="fFte" type="number" step="0.25" min="0" value="${p.fte}" ${dis}></div>
      <div class="fld"><label>Телефон</label><input id="fPhone" value="${esc(p.phone)}" placeholder="+7 …" ${dis}></div>
      <div class="fld full"><label>Email</label><input id="fEmail" value="${esc(p.email)}" placeholder="name@company.kz" ${dis}></div>
      <div class="fld full"><label>Примечание</label><textarea id="fNote" ${dis}>${esc(p.note)}</textarea></div>
    </div>
    <div class="mfoot">
      ${canDelete ? '<button class="btn danger edit-only" id="mDel" style="margin-right:auto">🗑 Удалить</button>' : ''}
      <button class="btn" id="mCancel">${editing ? 'Отмена' : 'Закрыть'}</button>
      <button class="btn primary edit-only" id="mSave">Сохранить</button>
    </div>`;
  ov.classList.add('show');
  const close = () => ov.classList.remove('show');
  document.getElementById('mClose').onclick = close;
  document.getElementById('mCancel').onclick = close;
  if (!editing) return;
  document.getElementById('mPhoto').onclick = () => document.getElementById('photoInput').click();
  document.getElementById('mPhotoDel').onclick = () => { pendingPhoto = ''; document.getElementById('mava').innerHTML = avatar({ ...p, photo: '' }); };
  document.getElementById('mSave').onclick = () => {
    const v = id => document.getElementById(id).value.trim();
    Object.assign(p, { name: v('fName'), title: v('fTitle') || p.title, en: v('fEn'), emp: v('fEmp'), cat: v('fEmp') === 'out' ? '' : v('fCat'), fte: parseFloat(v('fFte').replace(',', '.')) || 0, phone: v('fPhone'), email: v('fEmail'), note: v('fNote') });
    if (pendingPhoto !== undefined) p.photo = pendingPhoto;
    save(); render(); close(); toast('✅ Сохранено');
  };
  const del = document.getElementById('mDel');
  if (del) del.onclick = () => {
    if (!confirm('Удалить должность «' + p.title + '»?')) return;
    parent.children = parent.children.filter(c => c !== p); save(); render(); close(); toast('Должность удалена');
  };
}
function openUnit(id) {
  if (!editing) { return; }
  const [u] = findById(id); if (!u) return;
  const t = prompt('Название подразделения:', u.title);
  if (t && t.trim()) { u.title = t.trim(); save(); render(); }
}
document.getElementById('photoInput').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const img = new Image(), rd = new FileReader();
  rd.onload = () => { img.src = rd.result; };
  img.onload = () => { // crop square & compress to ~256px
    const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 256;
    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
    pendingPhoto = c.toDataURL('image/jpeg', .85);
    document.getElementById('mava').innerHTML = avatar({ ...current, photo: pendingPhoto });
  };
  rd.readAsDataURL(f);
});
ov.addEventListener('mousedown', e => { if (e.target === ov) ov.classList.remove('show'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') ov.classList.remove('show'); });

/* ---------------- toolbar ---------------- */
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200); }
document.getElementById('btnEdit').onclick = e => {
  editing = !editing; document.body.classList.toggle('editing', editing);
  e.currentTarget.classList.toggle('on', editing);
  toast(editing ? '✏️ Режим редактирования включён' : '👁 Режим просмотра');
};
document.getElementById('btnExpand').onclick = () => {
  const ids = []; walk(DATA.root, n => { if ((n.children && n.children.length) || n.list) ids.push(n.id); });
  if (collapsed.size) collapsed.clear(); else ids.forEach(i => { const [n] = findById(i); if (n.list) collapsed.add(i); });
  render();
};
document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'data.json'; a.click();
  toast('⬇ data.json скачан — положите его рядом с index.html в репозитории');
};
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  f.text().then(t => { const d = JSON.parse(t); if (!d.root) throw 0; DATA = d; reId(DATA.root); save(); render(); fit(); toast('⬆ Данные загружены'); })
    .catch(() => toast('⚠️ Неверный файл'));
};
document.getElementById('btnPrint').onclick = () => window.print();
document.getElementById('title').ondblclick = () => { if (!editing) return; const t = prompt('Заголовок:', DATA.meta.title); if (t) { DATA.meta.title = t; save(); render(); } };
document.getElementById('subtitle').ondblclick = () => { if (!editing) return; const t = prompt('Подзаголовок:', DATA.meta.subtitle); if (t !== null) { DATA.meta.subtitle = t; save(); render(); } };

let qT; document.getElementById('q').addEventListener('input', e => {
  clearTimeout(qT); qT = setTimeout(() => { query = e.target.value.trim().toLowerCase(); render(); if (query) focusFirstHit(); }, 150);
});
function focusFirstHit() {
  const h = document.querySelector('.hit'); if (!h) return;
  const r = h.getBoundingClientRect(), vp = viewport.getBoundingClientRect();
  view.x += (vp.width / 2) - (r.left + r.width / 2); view.y += (vp.height / 2 + 60) - (r.top + r.height / 2); apply(true);
}

/* clicks inside the chart (ignored if it was a drag) */
document.getElementById('stats').addEventListener('click', e => {
  const s = e.target.closest('[data-filter]'); if (!s) return;
  filter = filter === s.dataset.filter ? null : s.dataset.filter; render();
});
function handleClick(target) {
  const tg = target.closest('[data-toggle]'); if (tg) { const id = tg.dataset.toggle; collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); render(); return; }
  const add = target.closest('[data-add]');
  if (add) { const [u] = findById(add.dataset.add); const p = P('Новая должность', '', 'staff', 'PP'); u.children.push(p); save(); render(); openPos(p.id); return; }
  const head = target.closest('[data-head]');
  if (head) { if (editing && target.closest('.t')) return openUnit(head.dataset.head); const id = head.dataset.head; collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); render(); return; }
  const ue = target.closest('[data-unitedit]'); if (ue) return openUnit(ue.dataset.unitedit);
  const pos = target.closest('[data-id]'); if (pos) openPos(pos.dataset.id);
}

/* ---------------- pan & zoom ---------------- */
const viewport = document.getElementById('viewport'), stage = document.getElementById('stage');
const view = { x: 0, y: 0, s: 1 };
function apply(anim) {
  stage.style.transition = anim ? 'transform .35s ease' : 'none';
  stage.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  document.getElementById('zlvl').textContent = Math.round(view.s * 100) + '%';
}
function zoomAt(f, cx, cy, anim) {
  const ns = Math.min(2.5, Math.max(0.12, view.s * f)); f = ns / view.s;
  view.x = cx - (cx - view.x) * f; view.y = cy - (cy - view.y) * f; view.s = ns; apply(anim);
}
function fit() {
  const top = document.querySelector('.topbar').offsetHeight;
  const w = stage.scrollWidth, h = stage.scrollHeight, vw = innerWidth, vh = innerHeight - top;
  view.s = Math.min(1, Math.min(vw / w, vh / h) * 0.98);
  view.x = (vw - w * view.s) / 2; view.y = top + Math.max(0, (vh - h * view.s) / 2) - 10 * view.s; apply(true);
}
function fitWidth() {
  const top = document.querySelector('.topbar').offsetHeight;
  view.s = Math.min(1, innerWidth / stage.scrollWidth * 0.98);
  view.x = (innerWidth - stage.scrollWidth * view.s) / 2; view.y = top - 20 * view.s; apply(true);
}
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY);
}, { passive: false });
const ptrs = new Map(); let drag = null, pinch = null;
viewport.addEventListener('pointerdown', e => {
  if (e.target.closest('.topbar,.zoombox,.legend')) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, target: e.target };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: view.s }; drag = null; }
});
addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((pinch.s * d / pinch.d) / view.s, (a.x + b.x) / 2, (a.y + b.y) / 2); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 5) { drag.moved = true; viewport.classList.add('grabbing'); viewport.setPointerCapture?.(e.pointerId); }
  if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
});
addEventListener('pointerup', e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && !drag.moved) handleClick(drag.target);
  drag = null; viewport.classList.remove('grabbing');
});
addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); drag = null; pinch = null; });
document.getElementById('zin').onclick = () => zoomAt(1.2, innerWidth / 2, innerHeight / 2, true);
document.getElementById('zout').onclick = () => zoomAt(1 / 1.2, innerWidth / 2, innerHeight / 2, true);
document.getElementById('zfit').onclick = fit;
addEventListener('resize', () => fitWidth());

/* ---------------- boot ---------------- */
(async () => {
  await load();
  if (isExport) document.body.classList.add('export');
  render();
  if (!isExport) requestAnimationFrame(() => setTimeout(fitWidth, 30));
})();
</script>
</body>
</html>
